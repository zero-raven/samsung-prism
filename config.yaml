llm:
  extraction_model: "gemini-2.0-flash"
  reasoning_model: "gemini-2.0-flash"

thresholds:
  significance_min: 5
  alert_high: 8

news_sources:
  google_news:
    enabled: true
    queries:
      - "NSE India"
      - "Nifty Sensex"
      - "RBI policy"
      - "Indian banking"
    region: "IN"
    language: "en"
    max_articles_per_query: 10
  gdelt:
    enabled: true
    themes:
      - "ECON_STOCKMARKET"
      - "ECON_CENTRALBANK"
    max_articles: 20
  finnhub:
    enabled: true
    categories:
      - "general"
      - "forex"
    max_articles: 15

portfolio:
  default_holdings:
    - ticker: "NVDA"
      name: "NVIDIA Corp"
      sector: "semiconductors"
      quantity: 50
      avg_cost: 85.50
    - ticker: "AAPL"
      name: "Apple Inc"
      sector: "consumer_electronics"
      quantity: 100
      avg_cost: 150.00
    - ticker: "JPM"
      name: "JPMorgan Chase & Co"
      sector: "banking"
      quantity: 75
      avg_cost: 135.20
    - ticker: "XOM"
      name: "Exxon Mobil Corp"
      sector: "energy"
      quantity: 120
      avg_cost: 60.40
    - ticker: "LMT"
      name: "Lockheed Martin"
      sector: "defense"
      quantity: 20
      avg_cost: 400.00
